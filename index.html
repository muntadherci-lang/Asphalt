<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حاسبة تقرير تحليل الخلطة الإسفلتية</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f9;--fg:#14202e;--card:#fff;--bd:#d5dce6;--ac:#0a84c6;--acf:#fff;--bad:#c62828;--ok:#1b7f3b;--mut:#5b6b7d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--fg:#e6edf5;--card:#18222d;--bd:#2c3a49;--ac:#33a6e6;--acf:#06141f;--bad:#ff6b6b;--ok:#5ad17f;--mut:#9fb0c2}}
:root[data-theme="dark"]{--bg:#0f1720;--fg:#e6edf5;--card:#18222d;--bd:#2c3a49;--ac:#33a6e6;--acf:#06141f;--bad:#ff6b6b;--ok:#5ad17f;--mut:#9fb0c2}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:84px}
main{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:6px 0 2px}h2{font-size:15px;margin:0 0 8px;color:var(--ac);direction:ltr;text-align:right}
.sub{color:var(--mut);font-size:13px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px;direction:ltr;text-align:left}
input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px;width:100%;box-sizing:border-box;direction:ltr;text-align:left}
.o{border:1px dashed var(--bd);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;direction:ltr;text-align:left}
.o span{font-size:12px;color:var(--mut)}.o b{font-size:17px;color:var(--ok)}.o small{font-size:11px;color:var(--mut)}
.bad{color:var(--bad)!important}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px;direction:ltr}
td,th{border:1px solid var(--bd);padding:4px;text-align:center;font-size:13px}th{background:var(--ac);color:var(--acf)}
td input{padding:4px;text-align:center}td b{color:var(--ok)}
.note{font-size:12px;color:var(--mut);margin:8px 0 0}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);display:flex;gap:10px;align-items:center;justify-content:center}
button{font:inherit;font-weight:600;background:var(--ac);color:var(--acf);border:0;border-radius:10px;padding:11px 18px}button:disabled{opacity:.6}
#msg{font-size:13px;color:var(--mut)}
</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0a84c6"><link rel="apple-touch-icon" href="icon-192.png"></head><body>
<main><h1>تقرير تحليل الخلطة الإسفلتية</h1>
<p class="sub">أدخل القيم المقاسة فقط؛ تُحسب بقية الخانات تلقائياً وتُوسَم بـ (*) إن خرجت عن حدود المواصفة. ثم صدّر تقريراً بنفس قالب ملفك الأصلي.</p>
<div id="app"></div></main>
<div class="bar"><button id="exp">⬇ تصدير التقرير (Word)</button><button id="rst" style="background:transparent;color:var(--fg);border:1px solid var(--bd)">↺ مسح</button><span id="msg"></span></div>

function calc(){
 const n=x=>+x,v={},set=(k,t,ok)=>v[k]={t,ok:ok!==false},mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
 const gs=[],cs=[],fl=[];
 M.s.forEach((r,i)=>{const g=n(r.air)/(n(r.ssd)-n(r.water)),c=n(r.dial)*n(r.cf);gs.push(g);cs.push(c);fl.push(n(r.flow));set('g'+i,fmt(g,3));set('cs'+i,fmt(c,2))});
 const gmb=rnd(mean(gs),3),sa=rnd(mean(cs),1),fa=rnd(mean(fl),1);
 set('gm',fmt(gmb,3));set('sa',fmt(sa,1),sa>=+M.L.st);set('fa',fmt(fa,1),fa>=+M.L.fl1&&fa<=+M.L.fl2);
 const tot=n(M.pan);
 M.sv.forEach((r,i)=>{const d=i==7?1:0,ret=n(r.w)/tot*100,pas=100-ret,[lo,hi]=rg(r.j),p=rnd(pas,d);set('r'+i,fmt(ret,d));set('p'+i,fmt(pas,d),p>=lo&&p<=hi)});
 const g=M.g,a=M.a;
 const gmm=rnd(n(g.A)/(n(g.A)+n(g.B)-n(g.E)),3);set('gmm',fmt(gmm,3));
 const pb=rnd((n(a.A)-(n(a.C)+(n(a.D)-n(a.B))))/n(a.A)*100,2);set('pb',fmt(pb,2),pb>=+M.L.pb1&&pb<=+M.L.pb2);
 const av=rnd((1-gmb/gmm)*100,1);set('av',fmt(av,1),av>=+M.L.av1&&av<=+M.L.av2);
 const rs=rnd(n(M.b24)/sa*100,0);set('rs',fmt(rs,0),rs>=+M.L.rs);
 const ps=rnd(100-pb,2);set('ps',fmt(ps,2));
 const vma=rnd(100-ps*gmb/n(M.gsb),1);set('vma',fmt(vma,1),vma>=+M.L.vma);
 V=v;
}
